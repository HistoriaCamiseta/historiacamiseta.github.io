<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMISETAS HISTORIA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #6a0dad, #ff8c00); /* Degradado violeta arriba a naranja abajo */
            background-repeat: no-repeat; /* Evita que se repita */
            background-attachment: fixed; /* Fija el fondo para que no se mueva con el scroll */
            background-size: cover; /* Ajusta el fondo para ocupar toda la pantalla */
            color: white;
            display: flex;
            flex-direction: column;
            margin: 0;
        }


        .navbar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        .navbar img {
            height: 40px;
        }
        .navbar input {
            padding: 8px;
            font-size: 1em;
            border-radius: 10px;
            border: 1px solid #ccc;
            width: 200px;
            outline: none;
        }
        .sidebar {
            width: 180px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            color: white;
            text-align: center;
            position: fixed;
            top: 60px;
            left: 0;
            height: calc(100vh - 60px);
            border-radius: 0 15px 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sidebar h2 {
            font-size: 1.2em;
        }
        .sidebar .league-button {
            background: white;
            color: black;
            border: none;
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .sidebar .league-button:hover {
            background: lightgray;
        }
        .content {
            flex: 1;
            padding: 20px;
            margin-left: 200px;
            margin-top: 100px;
            text-align: left;
        }
        h1 {
            font-size: 3em;
            text-shadow: 2px 2px 5px black;
            text-align: center;
        }
        .league-info {
            display: flex;
            align-items: center;
            margin-left: 10px;
            gap: 15px;
            border-bottom: 3px black;
        }
        .league-info img {
            width: 50px;
            height: 50px;
        }
        .league-info h2 {
            font-size: 1.5em;
            margin: 0;
            color: black;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .jersey {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            border: 5px solid lightgray;
        }
        .jersey:hover {
            transform: scale(1.1);
        }
        .jersey img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="navbar" id="navbar">
        <img src="tu-logo.png" alt="Logo"> <!-- Cambia "tu-logo.png" por el nombre de tu archivo -->
        <input type="text" id="search" placeholder="Buscar camiseta...">
    </div>

    <div class="sidebar">
        <h2>Ligas Importantes</h2>
        <button class="league-button">Premier League (Inglaterra)</button>
        <button class="league-button">LaLiga (España)</button>
        <button class="league-button">Serie A (Italia)</button>
        <button class="league-button">Bundesliga (Alemania)</button>
        <button class="league-button">Ligue 1 (Francia)</button>
        <button class="league-button">MLS (EE.UU.)</button>
        <button class="league-button">Brasileirão (Brasil)</button>
        <button class="league-button">Liga MX (México)</button>
        <button class="league-button">Superliga Argentina (Argentina)</button>
        <button class="league-button">Copa Libertadores (Sudamérica)</button>
    </div>

    <div class="content">
        <h1>CAMISETAS HISTORIA</h1>

        <div class="league-info">
            <img src="CAMISETAS/logoligaargentina.png" alt="Liga Argentina">
            <h2>Liga Argentina</h2>
        </div>

        <div class="gallery" id="gallery">
            <div class="jersey"><img src="CAMISETAS/camisetaBOCA1978.webp" alt="Camiseta Boca 1978"></div>
            <div class="jersey"><img src="CAMISETAS/riber1996.webp" alt="Camiseta River 1996"></div>
            <div class="jersey"><img src="CAMISETAS/independiente1973.webp" alt="Camiseta Independiente 1973"></div>
            <div class="jersey"><img src="CAMISETAS/racing1967.webp" alt="Camiseta Racing 1967"></div>
            <div class="jersey"><img src="CAMISETAS/newells1992.webp" alt="Camiseta Newell's 1992"></div>
            <div class="jersey"><img src="CAMISETAS/sanlorenzo2014.webp" alt="Camiseta San Lorenzo 2014"></div>
            <div class="jersey"><img src="CAMISETAS/bocaJRS1990.webp" alt="Camiseta Boca 1990"></div>
        </div>
    </div>

    <script>
        // Barra de búsqueda funcional
        document.getElementById('search').addEventListener('input', function () {
            let searchValue = this.value.toLowerCase();
            document.querySelectorAll('.jersey').forEach(jersey => {
                let altText = jersey.querySelector('img').alt.toLowerCase();
                jersey.style.display = altText.includes(searchValue) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
